<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#282e26">
  <title>黄晓西 · 黔山同行</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./review.css">
  <link rel="stylesheet" href="./scenes.css">
  <link rel="stylesheet" href="./wardrobe-base.css">
  <link rel="stylesheet" href="./wardrobe-study/atelier.css">
  <link rel="stylesheet" href="./wardrobe-study/picker.css">
  <link rel="stylesheet" href="./wardrobe-study/grid.css">
  <link rel="stylesheet" href="./journal.css">
  <link rel="stylesheet" href="./main-scenes.css">
  <link rel="stylesheet" href="./scene-guide.css?v=scene-guide-20261119">
</head>
<body>
  <main id="app" class="app" aria-label="黄晓西旅行手账">
    <p class="boot" role="status">正在翻开手账…</p>
  </main>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <header class="sheet-head"><h2 id="sheet-title"></h2><button type="button" data-action="close" aria-label="关闭">×</button></header>
    <div id="sheet-body" class="sheet-body"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <template id="file-preview">
    <div class="stack">
      <section class="paper" aria-labelledby="file-preview-title">
        <h1 id="file-preview-title">打开本地预览</h1>
        <p>当前打开的是磁盘文件。请通过本地预览地址进入黄晓西旅行手账。</p>
        <a class="button primary" href="http://127.0.0.1:8782/design/review/index.html#partner">进入游客预览</a>
      </section>
    </div>
  </template>
  <!-- 入口和路由按此次主线接入版本加载。 -->
  <script type="module">
    if (location.protocol === 'file:') {
      const notice = document.querySelector('#file-preview').content.cloneNode(true);
      if (location.hash) notice.querySelector('a').hash = location.hash;
      document.querySelector('#app').replaceChildren(notice);
    } else {
      await import('./app.mjs?v=scene-guide-20261119');
    }
  </script>
</body>
</html>
