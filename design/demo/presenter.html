<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>黄晓西 · 演示准备</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="presenter.css" />
  </head>
  <body>
    <main>
      <h1>演示准备</h1>
      <p id="status" role="status">正在检查本机资源…</p>
      <a class="start" href="index.html">打开旅行手账 →</a>
      <h2>现场操作顺序</h2>
      <p>
        选择伙伴，领取景区见面礼并试穿。到山门入口打卡，抽一次云山装扮并保存。再到望山台、手作铺打卡，完成模拟手作，抽一次花溪装扮。最后选择三条经历，制作并下载纪念图。
      </p>
      <p>
        余额依次为 2、1、3、4、6、5 次。若加演 10 次模拟购买，余额应为 15 次。
      </p>
      <h2>测试点位</h2>
      <div id="points"></div>
      <h2>本机手账</h2>
      <p id="progress"></p>
      <button id="backup">下载演示存档</button
      ><label
        >载入已备份存档
        <input id="restore" type="file" accept="application/json" /></label
      ><button id="reset">重新开始彩排</button>
      <dialog id="confirm">
        <p id="warning"></p>
        <button id="cancel">保留当前手账</button
        ><button id="confirm-action">确认</button>
      </dialog>
    </main>
    <script type="module" src="presenter.mjs"></script>
  </body>
</html>
