</style></head><body><header><div><small>HUANG XIAOXI · HIGH FIDELITY 01</small><h1>把山水，穿进我们的故事</h1><p>21 个页面 · 正式登录与绑定流程 · 关键反馈状态<br>视觉设计示意，账号、交易和角色技术方案未接入。</p></div><a href="index.html#partner">进入逐页设计阅览 →</a></header><main id="gallery"></main><footer>人物与场景为基于原画板生成的概念素材；界面文字与操作区独立绘制。<br>本总览使用已导出的页面 PNG，可点击查看对应页面与状态。</footer><script type="module">
