<polygon points="900,490 893,478 907,478" fill="#527c64"/>
<polyline points="770,540 690,540 690,420 1080,420 1080,390" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1080,390 1073,402 1087,402" fill="#527c64"/>
<text x="745" y="417" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#476c55" font-weight="400" text-anchor="start">继续探索</text>
