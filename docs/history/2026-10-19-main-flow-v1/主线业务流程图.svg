<polyline points="1480,1210 1480,1270" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1480,1270 1473,1258 1487,1258" fill="#527c64"/>
<rect x="1240" y="1270" width="480" height="110" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1480.0" y="1317" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">保存 分享或以后回看</text>
<polyline points="1480,1380 1480,1450" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1480,1450 1473,1438 1487,1438" fill="#527c64"/>
<rect x="1300" y="1450" width="360" height="80" rx="16" fill="#e0ecdf" stroke="#b8cbbd" stroke-width="2"/>
<text x="1480" y="1499" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">本次游玩结束</text>
<rect x="60" y="1760" width="1660" height="85" rx="16" fill="#e9eee7" stroke="#d1dbcf" stroke-width="2"/>
<text x="85" y="1798" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#233b32" font-weight="400" text-anchor="start">主线边界：共享卡池到访任一关联点即可解锁；结束游玩后仍可抽取与换装。</text>
<text x="85" y="1833" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#617266" font-weight="400" text-anchor="start">图中返回操作选择为循环连接；失败、重试、概率、限次和后台字段留到子流程逐项确认。</text>
</svg>