<polygon points="900,700 893,688 907,688" fill="#527c64"/>
<polyline points="900,640 1480,640 1480,700" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1480,700 1473,688 1487,688" fill="#527c64"/>
<text x="320" y="682" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#233b32" font-weight="400" text-anchor="middle">收集与换装</text>
<text x="900" y="682" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#233b32" font-weight="400" text-anchor="middle">即时回忆</text>
<text x="1480" y="682" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#233b32" font-weight="400" text-anchor="middle">完成本次游玩</text>
