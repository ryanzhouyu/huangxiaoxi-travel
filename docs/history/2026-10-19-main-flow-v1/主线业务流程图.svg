<text x="320.0" y="747" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">05 选择已解锁卡池</text>
<text x="320.0" y="788" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">次数在本景区通用</text>
<polyline points="320,820 320,860" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="320,860 313,848 327,848" fill="#527c64"/>
<polygon points="320,860 465,945 320,1030 175,945" fill="#fff4d8" stroke="#bb9d54" stroke-width="2"/>
<text x="320" y="946" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#233b32" font-weight="700" text-anchor="middle">次数充足？</text>
<polyline points="320,1030 320,1090" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="320,1090 313,1078 327,1078" fill="#527c64"/>
<text x="335" y="1066" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#476c55" font-weight="400" text-anchor="start">不足，可选购买</text>
<rect x="80" y="1090" width="480" height="120" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="320.0" y="1137" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">模拟购买通用次数</text>
<text x="320.0" y="1178" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">成功后入账；也可去打卡获取</text>
<polyline points="80,1150 45,1150 45,945 175,945" fill="none" stroke="#527c64" stroke-width="3"/>
