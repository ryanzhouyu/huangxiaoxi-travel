<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1880" viewBox="0 0 1800 1880"><rect width="100%" height="100%" fill="#f5f5ef"/>
<text x="70" y="80" font-family="Microsoft YaHei,sans-serif" font-size="40" fill="#233b32" font-weight="700" text-anchor="start">黄晓西换装体验</text>
<text x="70" y="133" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#233b32" font-weight="400" text-anchor="start">一期主线业务流程图</text>
<text x="70" y="177" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#617266" font-weight="400" text-anchor="start">数字伙伴承载旅行回忆 · 单景区一次游玩 · 测试点位验证 · 购买次数采用模拟支付</text>
<rect x="60" y="230" width="360" height="160" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="240.0" y="277" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">01 选择数字伙伴</text>
<text x="240.0" y="318" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">首次选择初始形象</text>
<text x="240.0" y="354" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">回访恢复伙伴与进度</text>
<rect x="480" y="230" width="360" height="160" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="660.0" y="277" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">02 浏览景区与领装</text>
<text x="660.0" y="318" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">免费领取景区默认套装</text>
<text x="660.0" y="354" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">体验换装，不计实地到访</text>
<rect x="900" y="230" width="360" height="160" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1080.0" y="277" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">03 选择游玩任务</text>
<text x="1080.0" y="318" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">推荐路线 · 景点 · 商家</text>
<text x="1080.0" y="354" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">现场体验活动</text>
<rect x="1320" y="230" width="360" height="160" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1500.0" y="277" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">04 有效打卡与发奖</text>
<text x="1500.0" y="318" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">首次自动开始旅程并记录</text>
<text x="1500.0" y="354" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">次数入账 · 解锁关联卡池</text>
<polyline points="420,310 480,310" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="480,310 468,303 468,317" fill="#527c64"/>
