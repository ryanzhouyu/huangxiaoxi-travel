<text x="900.0" y="988" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">数字伙伴 · 地点 · 时间与经历</text>
<polyline points="900,1020 900,1100" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="900,1100 893,1088 907,1088" fill="#527c64"/>
<rect x="660" y="1100" width="480" height="110" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="900.0" y="1147" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">保存或分享当前作品</text>
<polyline points="900,1210 900,1270" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="900,1270 893,1258 907,1258" fill="#527c64"/>
<rect x="680" y="1270" width="440" height="60" rx="16" fill="#e8f0e5" stroke="#b8cbbd" stroke-width="2"/>
<text x="900" y="1308" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#233b32" font-weight="400" text-anchor="middle">返回操作选择，继续游玩</text>
<rect x="1240" y="700" width="480" height="120" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1480.0" y="747" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">08 主动结束本次游玩</text>
<text x="1480.0" y="788" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">无需走完所有点位或收齐套装</text>
<polyline points="1480,820 1480,900" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1480,900 1473,888 1487,888" fill="#527c64"/>
<rect x="1240" y="900" width="480" height="120" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1480.0" y="947" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">生成完整回忆总结</text>
<text x="1480.0" y="988" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">汇总本次游玩经历与收获</text>
<polyline points="1480,1020 1480,1100" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1480,1100 1473,1088 1487,1088" fill="#527c64"/>
<rect x="1240" y="1100" width="480" height="110" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
