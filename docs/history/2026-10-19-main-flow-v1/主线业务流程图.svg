<text x="900.0" y="747" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">07 随时查看回忆</text>
<text x="900.0" y="788" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">按已发生的经历生成</text>
<polyline points="900,820 900,900" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="900,900 893,888 907,888" fill="#527c64"/>
<rect x="660" y="900" width="480" height="120" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
