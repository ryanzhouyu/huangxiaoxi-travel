<polygon points="320,1320 313,1308 327,1308" fill="#527c64"/>
<text x="493" y="931" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#476c55" font-weight="400" text-anchor="start">充足</text>
<rect x="80" y="1320" width="480" height="120" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="320.0" y="1367" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">抽取并获得服饰部件</text>
<text x="320.0" y="1408" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">部件进入衣橱，可立即使用</text>
<polyline points="320,1440 320,1490" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="320,1490 313,1478 327,1478" fill="#527c64"/>
<rect x="80" y="1490" width="480" height="120" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="320.0" y="1537" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">06 按需换装并保存</text>
<text x="320.0" y="1578" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">可以直接返回，不强制试穿</text>
<polyline points="320,1610 320,1650" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="320,1650 313,1638 327,1638" fill="#527c64"/>
<rect x="100" y="1650" width="440" height="60" rx="16" fill="#e8f0e5" stroke="#b8cbbd" stroke-width="2"/>
