<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1320" viewBox="0 0 1700 1320"><rect width="100%" height="100%" fill="#f5f5ef"/>
<text x="70" y="72" font-family="Microsoft YaHei,sans-serif" font-size="40" fill="#233b32" font-weight="700" text-anchor="start">黄晓西换装体验一期主线业务流程图</text>
<text x="70" y="121" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#617266" font-weight="400" text-anchor="start">v2 · 2026.10.19    线上体验 → 实地游玩与打卡 → 抽取与装扮 → 回忆分享</text>
<rect x="70" y="230" width="460" height="220" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="300.0" y="277" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">01 选择数字伙伴</text>
<text x="300.0" y="318" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">首次选择喜欢的初始形象</text>
<text x="300.0" y="354" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">回访恢复伙伴与已有进度</text>
<rect x="620" y="230" width="460" height="220" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="850.0" y="277" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">02 线上了解景区并领装</text>
<text x="850.0" y="318" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">了解感兴趣的景区</text>
<text x="850.0" y="354" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">领取免费套装，体验换装</text>
<rect x="1170" y="230" width="460" height="220" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1400.0" y="277" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">03 实地游玩并打卡</text>
<text x="1400.0" y="318" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">入口／景点／商家／现场活动</text>
<text x="1400.0" y="354" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">有效打卡后自动：</text>
<text x="1400.0" y="390" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">记录经历＋发次数＋解锁关联卡池</text>
<polyline points="530,340 620,340" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="620,340 608,333 608,347" fill="#527c64"/>
<polyline points="1080,340 1170,340" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1170,340 1158,333 1158,347" fill="#527c64"/>
<rect x="1170" y="680" width="460" height="230" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1400.0" y="727" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">04 抽取装扮奖励</text>
<text x="1400.0" y="768" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">使用本景区通用次数</text>
<text x="1400.0" y="804" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">在已解锁卡池抽取</text>
<text x="1400.0" y="840" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">服装部件／表情／动作</text>
<rect x="620" y="680" width="460" height="230" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="850.0" y="727" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">05 装扮数字伙伴</text>
<text x="850.0" y="768" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">搭配服装、表情或动作</text>
<text x="850.0" y="804" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">预览并保存伙伴形象</text>
<rect x="70" y="680" width="460" height="230" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="300.0" y="727" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">06 生成回忆并分享</text>
<text x="300.0" y="768" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">以真实游玩经历为基础</text>
<text x="300.0" y="804" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">可当日或多日汇总</text>
<text x="300.0" y="840" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">保存或分享静态纪念图</text>
<polyline points="1400,450 1400,680" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1400,680 1393,668 1407,668" fill="#527c64"/>
<text x="1190" y="524" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#233b32" font-weight="400" text-anchor="start">一次打卡即抽</text>
<text x="1190" y="561" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#233b32" font-weight="400" text-anchor="start">多次累积后抽</text>
<polyline points="1170,795 1080,795" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1080,795 1092,788 1092,802" fill="#527c64"/>
<polyline points="620,795 530,795" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="530,795 542,788 542,802" fill="#527c64"/>
<polyline points="1170,365 1130,365 1130,570 300,570 300,680" fill="none" stroke="#527c64" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="300,680 293,668 307,668" fill="#527c64"/>
<text x="390" y="550" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#617266" font-weight="400" text-anchor="start">每次打卡积累真实经历，也可直接回顾生成</text>
<polyline points="70,795 30,795 30,180 1400,180 1400,230" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1400,230 1393,218 1407,218" fill="#527c64"/>
<text x="1040" y="166" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#476c55" font-weight="400" text-anchor="start">继续实地游玩，持续积累经历</text>
<polyline points="1400,910 1400,1010" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1400,1010 1393,998 1407,998" fill="#527c64"/>
<text x="1190" y="973" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#476c55" font-weight="400" text-anchor="start">次数不足时，可选</text>
<rect x="1170" y="1010" width="460" height="120" rx="16" fill="#ffffff" stroke="#b8cbbd" stroke-width="2"/>
<text x="1400.0" y="1057" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#233b32" font-weight="700" text-anchor="middle">模拟购买抽奖次数</text>
<text x="1400.0" y="1098" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#4d6256" font-weight="400" text-anchor="middle">支付演示成功后入账</text>
<polyline points="1630,1070 1670,1070 1670,795 1630,795" fill="none" stroke="#527c64" stroke-width="3"/>
<polygon points="1630,795 1642,788 1642,802" fill="#527c64"/>
<text x="1618" y="953" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#476c55" font-weight="400" text-anchor="start">入账</text>
<rect x="70" y="995" width="1000" height="135" rx="16" fill="#e8f0e5" stroke="#b8cbbd" stroke-width="2"/>
<text x="95" y="1040" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#233b32" font-weight="700" text-anchor="start">中途、当天回酒店后、连续游玩多天后，均可分享。</text>
<text x="95" y="1089" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#233b32" font-weight="400" text-anchor="start">已有经历可反复生成，无需重新打卡、抽奖或换装。</text>
<rect x="70" y="1190" width="1560" height="95" rx="16" fill="#e9eee7" stroke="#d1dbcf" stroke-width="2"/>
<text x="95" y="1230" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#233b32" font-weight="400" text-anchor="start">回忆前提：至少一次有效实地打卡；线上领装与购买次数不产生到访经历。</text>
<text x="95" y="1270" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#617266" font-weight="400" text-anchor="start">路线导览是辅助功能；不设强制选任务、选择下一步或主动结束游玩的环节。</text>
</svg>