</style><main><header><h1>黔山同行 · 逐屏对照</h1><p>左为确认稿，右为游客端实机截图。44 个可对应状态均采自独立测试身份。正式登录、验证码、绑定与账号安全四稿留待接入。 <a href="footer/修复前后对照.jpg">查看底部布局修复前后对照</a></p></header><nav><label>画面<select id="screen"></select></label><label>实机尺寸<select id="device"><option>390x844</option><option>360x640</option><option>1280x720</option></select></label><button id="prev">上一张</button><button id="next">下一张</button></nav><div class="pair"><figure><figcaption>已确认视觉稿 · 390 × 844</figcaption><div class="window"><img id="gold" alt="确认稿"></div></figure><figure><figcaption>当前演示版 · <a id="full" target="_blank">打开完整截图</a></figcaption><div class="window" id="win"><img id="live" alt="实机截图"></div></figure></div><p class="note" id="note"></p><a href="../../design/demo/index.html">进入游客演示</a></main><script>const rows=[{"id": "01", "name": "演示身份", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "05", "name": "选择出发装扮", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "06", "name": "伙伴首页", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "07", "name": "发现贵州", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "08", "name": "景区导览", "note": "沿用演示版景区详情的返回路径；三枚主导航仍出现在伙伴、游玩总览和回忆三个主场景。"}, {"id": "09", "name": "地点一览", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "10", "name": "领取景区见面礼", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "11", "name": "山门入口", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "12", "name": "点位码核验", "note": "测试码输入和填入测试码入口都保留。示例时间取自测试身份。"}, {"id": "13", "name": "首次打卡结果", "note": "按真实核验结果分别显示经历、奖励与新解锁卡池。"}, {"id": "14", "name": "山间手作铺", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "15", "name": "店内活动", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "16", "name": "望山台", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "17", "name": "花溪小径", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "18", "name": "重复到访", "note": "本次到访有记录，首次奖励保持已领。"}, {"id": "19", "name": "云山卡池 · 可抽取", "note": "示例已收集 2/7，余额 2。下方仍能查看本池的表情、姿势与背景。"}, {"id": "20", "name": "花溪卡池 · 待解锁", "note": "保持两处关联地点的原入口。"}, {"id": "21", "name": "获得单件上装", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "22", "name": "次数不足", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "23", "name": "可领取的机会", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "24", "name": "全池收齐", "note": "收齐后仍提供原有的继续游玩和手账入口。"}, {"id": "25", "name": "旅行衣橱", "note": "右侧衣架来自账号已拥有的部件。当前穿着和试穿草稿分别呈现。"}, {"id": "26", "name": "套装目录", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "27", "name": "套装详情", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "28", "name": "卡池陈列 · 下滑", "note": "此处对应同一页向下滚动后的陈列，四件服饰和其余三项奖品都能查看来源。"}, {"id": "29", "name": "单件来源", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "30", "name": "挑选经历", "note": "沿用制作页原有的日期筛选与多选框，在页内选经历。"}, {"id": "31", "name": "一路足迹", "note": "卡片来自实际到访，按本地日期分组；当天多次到店与完成体验各有一条记录。"}, {"id": "32", "name": "足迹详情", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "33", "name": "纪念作品册", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "34", "name": "单页纪念 · 编辑", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "35", "name": "已生成预览", "note": "生成后的预览与下载共用同一文件；编辑入口保留在保存操作后方。"}, {"id": "36", "name": "作品详情", "note": "作品下方保留可查看的来源快照，以及下载、分享和另做一张的入口。"}, {"id": "37", "name": "尚未到访", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "38", "name": "已有足迹 · 尚无作品", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "39", "name": "分享回退", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "40", "name": "我的旅行身份", "note": "独立演示身份沿用本机手账。"}, {"id": "42", "name": "次数与收支", "note": "沿用连续的流水与订单列表布局。"}, {"id": "43", "name": "选择套餐", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "44", "name": "订单详情", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "45", "name": "确认模拟支付", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "46", "name": "足迹长图", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "47", "name": "离开未保存的试穿", "note": "文案、次数、穿着与记录按当前演示账号呈现。"}, {"id": "48", "name": "模拟订单列表", "note": "订单仍在钱包内连续查看。"}];const el=id=>document.getElementById(id),s=el('screen'),d=el('device');for(const r of rows)s.add(new Option(r.id+'　'+r.name,r.id));function update(){const r=rows[s.selectedIndex];el('gold').src='reference/'+r.id+'.webp';el('live').src=el('full').href=d.value+'/'+r.id+'.webp';el('win').className='window '+(d.value==='1280x720'?'desktop':d.value==='360x640'?'small':'');el('note').textContent=r.note;history.replaceState(null,'','#'+r.id)}function step(n){s.selectedIndex=(s.selectedIndex+n+rows.length)%rows.length;update()}if(rows.some(r=>r.id===location.hash.slice(1)))s.value=location.hash.slice(1);else s.value='19';s.onchange=d.onchange=update;el('prev').onclick=()=>step(-1);el('next').onclick=()=>step(1);update()</script></html>
