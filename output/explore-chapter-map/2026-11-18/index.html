<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#29392d">
  <title>发现贵州 · 章节地图样稿</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../design/review/review.css">
  <link rel="stylesheet" href="../../../design/review/main-scenes.css">
  <link rel="stylesheet" href="./atlas.css?v=filters-20261119">
  <script src="./atlas.js?v=interactions-20261118" defer></script>
</head>
<body>
  <main class="app">
    <section class="destination root-world scene atlas" aria-label="发现贵州">
      <div class="atlas-art" aria-hidden="true"></div>
      <div class="atlas-content">
        <header class="destination-head atlas-header" id="map-header">
          <span>黄晓西 · 黔山同行</span>
          <h1>发现贵州</h1>
        </header>

        <div class="atlas-filters" id="filters">
          <div class="region-control" id="region-control">
            <button class="region-filter" id="region-filter" type="button" aria-controls="region-options" aria-expanded="false">
              <span class="sr">地市州</span><span id="region-label">全部市州</span><span class="caret" aria-hidden="true"></span>
            </button>
            <div class="region-dropdown" id="region-options" role="group" aria-label="按地市州筛选" hidden>
              <button type="button" value="all" aria-pressed="true">全部市州</button>
              <button type="button" value="anshun" aria-pressed="false">安顺市</button>
              <button type="button" value="guiyang" aria-pressed="false">贵阳市</button>
              <button type="button" value="qiannan" aria-pressed="false">黔南州</button>
            </div>
          </div>
          <div class="category-filter" role="group" aria-label="景区类别">
            <button type="button" data-category="all" aria-pressed="true">全部</button>
            <button type="button" data-category="nature" aria-pressed="false">自然风光</button>
            <button type="button" data-category="culture" aria-pressed="false">人文</button>
          </div>
        </div>

        <div class="map-labels" role="group" aria-label="景区章节" id="map-labels">
          <button class="chapter-pin pin-jiaxiu" type="button" data-chapter="jiaxiu" data-region="guiyang" data-type="culture" aria-label="甲秀楼，贵阳市，打开景区章节">
            <span class="landmark-cutout" aria-hidden="true"><span class="landmark-art"></span></span>
            <span class="pin-point" aria-hidden="true"></span>
            <span class="chapter-sign"><strong>甲秀楼</strong><small>贵阳市</small></span>
          </button>
          <button class="chapter-pin pin-huangguoshu" type="button" data-chapter="huangguoshu" data-region="anshun" data-type="nature" aria-label="黄果树，安顺市，打开景区章节">
            <span class="landmark-cutout" aria-hidden="true"><span class="landmark-art"></span></span>
            <span class="pin-point" aria-hidden="true"></span>
            <span class="chapter-sign"><strong>黄果树</strong><small>安顺市</small></span>
          </button>
          <button class="chapter-pin pin-xiaoqikong" type="button" data-chapter="xiaoqikong" data-region="qiannan" data-type="nature" aria-label="小七孔，黔南州，打开景区章节">
            <span class="landmark-cutout" aria-hidden="true"><span class="landmark-art"></span></span>
            <span class="pin-point" aria-hidden="true"></span>
            <span class="chapter-sign"><strong>小七孔</strong><small>黔南州</small></span>
          </button>
        </div>

        <p class="sr" id="result-count" role="status"></p>
        <div class="empty-map" id="no-results" hidden>
          <p>这组条件下暂无景区</p>
          <button id="reset-filters" type="button">查看全部景区</button>
        </div>
        <p class="map-caption" id="map-caption">游玩示意图</p>

        <div class="chapter-view" id="chapter-view" hidden>
          <header class="chapter-heading">
            <button class="return-map" type="button" id="return-map"><span aria-hidden="true">‹</span> 贵州地图</button>
            <div class="destination-head">
              <span id="chapter-region"></span>
              <h1 id="chapter-title" tabindex="-1"></h1>
            </div>
          </header>
          <section class="chapter-journal" aria-labelledby="stage-title">
            <div class="journal-heading">
              <h2 id="stage-title">景点关卡</h2>
              <span>到访后点亮足迹</span>
            </div>
            <div class="stage-nodes" id="stage-nodes" role="group" aria-label="景点关卡"></div>
            <p class="stage-status" id="stage-status" role="status"></p>
          </section>
        </div>
      </div>

      <nav class="main-nav" aria-label="主场景">
        <a class="nav-tab" href="http://127.0.0.1:8782/design/review/index.html#partner" target="_blank" rel="noopener">
          <span class="nav-art nav-art-companion" aria-hidden="true"><img class="portrait" src="../../../design/review/journal-art/companion.webp" alt=""></span>
          <span>伙伴</span>
        </a>
        <a class="nav-tab" href="./index.html" aria-current="page" id="explore-tab">
          <span class="nav-art nav-art-map" aria-hidden="true"></span><span>游玩</span>
        </a>
        <a class="nav-tab" href="http://127.0.0.1:8782/design/review/index.html#memories" target="_blank" rel="noopener">
          <span class="nav-art nav-art-journal" aria-hidden="true"></span><span>回忆</span>
        </a>
      </nav>
    </section>
  </main>

</body>
</html>
