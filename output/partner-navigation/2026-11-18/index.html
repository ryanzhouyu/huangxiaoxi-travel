<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>伙伴首页与主场景导航对照</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #eee6d8; color: #392c25; font: 15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif }
    main { width: min(100%, 860px); padding: 24px 16px 36px; margin: auto }
    h1,h2 { margin: 0 0 10px; line-height: 1.2; font-family: KaiTi,"Kaiti SC",SimSun,serif }
    h1 { font-size: clamp(25px, 6vw, 36px) }
    h2 { font-size: 23px }
    p { margin: 0 0 12px }
    header { border-bottom: 1px solid #bba387; padding-bottom: 14px }
    nav { display: flex; gap: 9px 18px; flex-wrap: wrap }
    a { color: #743f38; text-underline-offset: 4px }
    section { margin-top: 26px }
    .comparison { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; align-items: start }
    figure { margin: 0; padding: 6px; background: #faf2e4; border: 1px solid #c9b597 }
    figcaption { padding: 3px 4px 7px }
    img { width: 100%; height: auto; display: block; background: #44362b }
  </style>
</head>
<body>
<main>
  <header>
    <h1>伙伴首页与主场景导航对照</h1>
    <p>用相同搭配和到访记录比较改动前后的实际画面。</p>
    <nav aria-label="复验入口">
      <a href="../../../design/review/index.html#partner">打开伙伴首页</a>
      <a href="review.json">专项验收记录</a>
      <a href="#small-screen">查看小屏与安全区</a>
    </nav>
  </header>
  <section>
    <h2>伙伴 · 390×844</h2>
    <div class="comparison">
      <figure><figcaption>改动前</figcaption><img src="partner-before.webp" width="390" height="844" alt="旧首页的三张独立底部按钮和竖排见面礼"></figure>
      <figure><figcaption>改动后</figcaption><img src="partner-after.webp" width="390" height="844" alt="新首页的横排见面礼、同组道具和延伸过导航的夜景"></figure>
    </div>
  </section>
  <section>
    <h2>游玩 · 390×844</h2>
    <div class="comparison">
      <figure><figcaption>改动前</figcaption><img src="explore-before.webp" width="390" height="844" alt="旧游玩页底部地图断带和旧式导航"></figure>
      <figure><figcaption>改动后</figcaption><img src="explore-after.webp" width="390" height="844" alt="游玩页地图延续到统一导航"></figure>
    </div>
  </section>
  <section>
    <h2>回忆 · 390×844</h2>
    <div class="comparison">
      <figure><figcaption>改动前</figcaption><img src="memories-before.webp" width="390" height="844" alt="旧手账书尾和托架之间的分割线"></figure>
      <figure><figcaption>改动后</figcaption><img src="memories-after.webp" width="390" height="844" alt="书尾接木纹托架和统一导航，制作按钮仍独立"></figure>
    </div>
  </section>
  <section id="small-screen">
    <h2>360×640 小屏 · 模拟 30px 底部安全区</h2>
    <div class="comparison">
      <figure><figcaption>初次进入</figcaption><img src="partner-first-visit-safe.webp" width="360" height="640" alt="尚未到访的伙伴首页，人物全身、对白和底部安全区"></figure>
      <figure><figcaption>回忆与制作入口</figcaption><img src="memories-safe.webp" width="360" height="640" alt="小屏手账与木纹导航，制作入口可达"></figure>
    </div>
  </section>
</main>
</body>
</html>
