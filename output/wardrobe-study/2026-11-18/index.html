<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行衣橱 · 同数据对照</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #f2ebdb; color: #3e2f27; font: 16px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif }
    main { max-width: 1010px; margin: auto; padding: 28px 18px 46px }
    header { padding: 0 0 14px; border-bottom: 1px solid #b7976d }
    h1, h2 { margin: 0 0 10px; font-family: KaiTi, STKaiti, serif }
    h1 { font-size: 32px }
    h2 { font-size: 24px }
    p { margin: 7px 0 }
    a { color: #375241; text-underline-offset: 3px }
    nav { display: flex; flex-wrap: wrap; gap: 5px 18px; margin-top: 12px }
    section { margin-top: 26px }
    .comparison, .states { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 15px }
    .states { grid-template-columns: repeat(3, minmax(0, 1fr)) }
    figure { margin: 0; padding: 8px; border: 1px solid #c7ac80; border-radius: 4px; background: #fff8e8 }
    figcaption { margin-bottom: 5px; font-size: 14px }
    img { display: block; width: 100%; height: auto; background: #34261e }
    .wide { max-width: 100% }
    @media (max-width: 620px) {
      main { padding-inline: 10px }
      .states { grid-template-columns: repeat(2, minmax(0, 1fr)) }
      .comparison, .states { gap: 6px }
      figure { padding: 4px }
    }
    @media (max-width: 470px) {
      .comparison, .states { grid-template-columns: minmax(0, 1fr); gap: 12px }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>旅行衣橱 · 同数据对照</h1>
    <p>2026-11-18。现版 <code>731f0d4</code> 和独立样板使用同一评审库存、相同的溪边薄荷初始搭配，以及同一件黔山初见上装。</p>
    <nav aria-label="验证入口">
      <a href="../../../design/review/wardrobe-study/">试穿样板</a>
      <a href="../../../design/review/wardrobe-study/?source=compose&amp;save=reject">试一次保存失败</a>
      <a href="checks.json">浏览器检查记录</a>
    </nav>
  </header>
  <section>
    <h2>390×844 · 试穿同一件上装</h2>
    <div class="comparison">
      <figure><figcaption>现版</figcaption><img src="prior-390-try.webp" alt="现版衣橱试穿黔山初见上装，右侧标记已穿着与试穿中" width="390" height="844"></figure>
      <figure><figcaption>候选设计</figcaption><img src="study-390-try.webp" alt="候选衣橱试穿黔山初见上装，右侧标记已保存穿着与正在试穿" width="390" height="844"></figure>
    </div>
    <p>右边的衣架标签回答两件事：目前试穿哪一件，最后保存哪一件。桌沿保留七个类别和三项操作，场景画面与桌沿接在一起。</p>
  </section>
  <section>
    <h2>360×640 · 初始搭配与衣架末项</h2>
    <div class="comparison">
      <figure><figcaption>初始搭配</figcaption><img src="study-360-default.webp" alt="小屏上的初始衣橱，鞋尖完整，保存按钮禁用" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>翻到第六件并试穿</figcaption><img src="study-360-last.webp" alt="滚动衣架后选中花溪漫步，名称和状态完整显示" width="360" height="640" loading="lazy"></figure>
    </div>
  </section>
  <section>
    <h2>360×640 · 表情、姿势与背景</h2>
    <div class="states">
      <figure><figcaption>表情看脸部差异</figcaption><img src="study-360-expression.webp" alt="右侧两张真实表情的脸部预览" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>姿势看全身轮廓</figcaption><img src="study-360-pose.webp" alt="晓西挥手，右侧用全身站立和挥手作为对应预览" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>背景看实际取景</figcaption><img src="study-360-background.webp" alt="舞台切换为山色亭台，缩略图与所选场景一致" width="360" height="640" loading="lazy"></figure>
    </div>
  </section>
  <section>
    <h2>360×640 · 返回与失败恢复</h2>
    <div class="states">
      <figure><figcaption>返回时确认试穿去留</figcaption><img src="study-360-cancel.webp" alt="未保存弹窗有保存并返回、放弃试穿并返回和继续试穿选项" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>失败保留试穿，底部模拟 30px 安全区</figcaption><img src="study-360-failure-safe.webp" alt="保存失败、试穿仍保留，底部操作区留出模拟安全区" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>重试成功返回照相馆来源</figcaption><img src="study-360-compose.webp" alt="照相馆评审来源显示已保存人物与原标题、模板、所选经历" width="360" height="640" loading="lazy"></figure>
    </div>
  </section>
  <section>
    <h2>1440×1000 · 桌面</h2>
    <figure class="wide"><figcaption>保留可纵向操作的完整工坊，使用同一套七部位与桌沿操作</figcaption><img src="study-1440-background.webp" alt="桌面居中展示换装舞台，围绕舞台延续工坊背景" width="1440" height="1000" loading="lazy"></figure>
  </section>
</main>
</body>
</html>
