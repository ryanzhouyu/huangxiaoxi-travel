<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行衣橱 · 缩略图与大图对照</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #eee7d9; color: #352a27; font: 15px/1.65 "PingFang SC", "Microsoft YaHei", sans-serif }
    main { max-width: 900px; margin: auto; padding: 24px 16px 40px }
    h1, h2 { margin: 0 0 8px; font-family: "Songti SC", SimSun, serif; line-height: 1.2 }
    h1 { font-size: clamp(24px, 6vw, 36px) }
    h2 { font-size: 23px }
    p { margin: 7px 0 }
    a { color: #653e34; text-underline-offset: 4px }
    header { padding-bottom: 14px; border-bottom: 1px solid #b8a490 }
    nav { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 9px }
    section { margin-top: 24px }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); align-items: start; gap: 14px }
    figure { margin: 0; padding: 8px; border: 1px solid #c7b39f; background: #f7f1e5 }
    figcaption { margin-bottom: 5px }
    img { display: block; width: 100%; height: auto; background: #5f493d }
    @media (max-width: 510px) { .pair { grid-template-columns: minmax(0,1fr) } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>旅行衣橱 · 缩略图与大图</h1>
    <p>在衣橱直接点图试穿。要看织纹或场景全貌时，点「查看大图」浏览这一类的物件。</p>
    <nav aria-label="评审入口">
      <a href="../../../design/review/wardrobe-study/?layout=atelier&amp;picker=detail">试穿候选稿</a>
      <a href="../../../design/review/wardrobe-study/?layout=atelier">试穿上一轮</a>
      <a href="checks.json">浏览器记录</a>
    </nav>
  </header>
  <section>
    <h2>390×844 · 底部常驻操作</h2>
    <div class="pair">
      <figure><figcaption>上一轮</figcaption><img src="../../wardrobe-layout-review/2026-11-18/study-390-try.webp" width="390" height="844" alt="上一轮选衣区，部件名称和件数占一行，缩略图较小"></figure>
      <figure><figcaption>本轮候选 · 加大缩略图</figcaption><img src="study-390-try.webp" width="390" height="844" alt="同一件黔山初见上装，底部红色上装的缩略图更清楚，左侧有查看大图"></figure>
    </div>
  </section>
  <section>
    <h2>360×640 · 大图内翻阅</h2>
    <div class="pair">
      <figure><figcaption>看单品纹样 · 试穿这一件</figcaption><img src="detail-360-clothing.webp" width="360" height="640" alt="黔山初见上装的大图显示银饰、衣领和织纹，下方可翻阅或试穿" loading="lazy"></figure>
      <figure><figcaption>看全幅背景 · 模拟 30px 底部安全区</figcaption><img src="detail-360-background-safe.webp" width="360" height="640" alt="山色留白全幅原画，画面上下边缘均完整，预览按钮位于安全区上方" loading="lazy"></figure>
    </div>
  </section>
</main>
</body>
</html>
