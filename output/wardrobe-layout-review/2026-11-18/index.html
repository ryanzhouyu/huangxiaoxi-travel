<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行衣橱 · 布局与人物层次对照</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #eee7d9; color: #352a27; font: 15px/1.65 "PingFang SC", "Microsoft YaHei", sans-serif }
    main { max-width: 980px; margin: auto; padding: 26px 16px 42px }
    h1, h2 { margin: 0 0 6px; font-family: "Songti SC", SimSun, serif; line-height: 1.2 }
    h1 { font-size: clamp(24px, 5.6vw, 38px) }
    h2 { font-size: 24px }
    p { margin: 7px 0 }
    a { color: #653e34; text-underline-offset: 4px }
    header { padding-bottom: 18px; border-bottom: 1px solid #b8a490 }
    nav { display: flex; flex-wrap: wrap; gap: 6px 20px; padding-top: 5px }
    section { margin-top: 24px }
    .pair, .states { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); align-items: start; gap: 14px }
    .states { grid-template-columns: repeat(3,minmax(0,1fr)) }
    figure { margin: 0; padding: 8px; border: 1px solid #c7b39f; background: #f7f1e5 }
    figcaption { margin-bottom: 4px }
    img { display: block; width: 100%; height: auto; background: #5f493d }
    @media (max-width: 640px) { .states { grid-template-columns: repeat(2,minmax(0,1fr)) } }
    @media (max-width: 510px) { .pair, .states { grid-template-columns: minmax(0,1fr) } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>旅行衣橱 · 布局与人物层次</h1>
    <p>同一工坊、同一人物、同一件黔山初见上装。看人物轮廓、分类与选衣的距离、衣服标签和保存位置。</p>
    <nav aria-label="评审入口">
      <a href="../../../design/review/wardrobe-study/?layout=atelier">试穿候选稿</a>
      <a href="../../../design/review/wardrobe-study/">试穿上一轮</a>
      <a href="../../../design/review/wardrobe-study/?layout=atelier&amp;source=compose&amp;save=reject">试一次保存失败</a>
      <a href="checks.json">检查记录</a>
    </nav>
  </header>
  <section>
    <h2>390×844</h2>
    <div class="pair">
      <figure><figcaption>上一轮 · 右侧选衣</figcaption><img src="prior-390-try.webp" alt="右侧是纵向衣架，底部有部位分类、保存与返回" width="390" height="844"></figure>
      <figure><figcaption>本轮候选 · 下方选衣</figcaption><img src="study-390-try.webp" alt="晓西居中，工坊背景退后；底部同一区域有分类、横向单品和保存" width="390" height="844"></figure>
    </div>
  </section>
  <section>
    <h2>360×640</h2>
    <div class="pair">
      <figure><figcaption>上一轮 · 右侧选衣</figcaption><img src="prior-360-try.webp" alt="小屏右侧选衣的试穿画面" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>本轮候选 · 下方选衣</figcaption><img src="study-360-try.webp" alt="小屏把选择和完成动作放在同一张浅色面上" width="360" height="640" loading="lazy"></figure>
    </div>
  </section>
  <section>
    <h2>小屏各状态</h2>
    <div class="states">
      <figure><figcaption>横滑到第六件</figcaption><img src="study-360-last.webp" alt="花溪漫步上装进入视野，名称和正在试穿完整呈现" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>预览背景与挥手姿势</figcaption><img src="study-360-background.webp" alt="晓西在山色亭台挥手，角色轮廓、鞋尖完整" width="360" height="640" loading="lazy"></figure>
      <figure><figcaption>保存失败 · 模拟 30px 安全区</figcaption><img src="study-360-failure-safe.webp" alt="错误提示在选衣下方，当前试穿及保存、恢复与取消都可见" width="360" height="640" loading="lazy"></figure>
    </div>
  </section>
  <section>
    <h2>1440×1000</h2>
    <figure><figcaption>桌面 · 同一试穿界面</figcaption><img src="study-1440-try.webp" alt="桌面居中的候选衣橱，人物与下方部件的原始排版" width="1440" height="1000" loading="lazy"></figure>
  </section>
</main>
</body>
</html>
