<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#29392d">
  <title>发现贵州 · 景区首层视觉样稿</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../design/review/review.css">
  <link rel="stylesheet" href="../../../design/review/main-scenes.css">
  <link rel="stylesheet" href="./study.css">
  <script src="./study.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="destination root-world scene district-study" aria-labelledby="title">
      <div class="world-art" aria-hidden="true"></div>
      <div class="study-body">
        <header class="destination-head">
          <span>黄晓西 · 黔山同行</span>
          <h1 id="title">发现贵州</h1>
        </header>

        <div class="filters">
          <button class="region-filter" id="region-filter" type="button" aria-haspopup="dialog" aria-controls="region-sheet" aria-expanded="false">
            <span class="sr">地市州</span><span id="region-label">全部市州</span><span class="caret" aria-hidden="true"></span>
          </button>
          <div class="category-filter" role="group" aria-label="景区类别">
            <button type="button" data-category="all" aria-pressed="true">全部</button>
            <button type="button" data-category="nature" aria-pressed="false">自然风光</button>
            <button type="button" data-category="culture" aria-pressed="false">人文</button>
          </div>
        </div>

        <div class="destination-scroll">
          <p class="sr" id="result-count" role="status"></p>
          <ul class="postcards" aria-label="景区">
            <li class="postcard waterfall" data-region="anshun" data-type="nature">
              <img class="postcard-photo" src="./assets/huangguoshu.webp" alt="黄果树大瀑布" width="960" height="720">
              <div class="postcard-caption">
                <h2>黄果树</h2><p>安顺市<span aria-hidden="true"> · </span>自然风光</p>
              </div>
            </li>
            <li class="postcard pavilion" data-region="guiyang" data-type="culture">
              <img class="postcard-photo" src="./assets/jiaxiu.webp" alt="南明河畔的甲秀楼" width="960" height="640">
              <div class="postcard-caption">
                <h2>甲秀楼</h2><p>贵阳市<span aria-hidden="true"> · </span>人文</p>
              </div>
            </li>
            <li class="postcard bridge" data-region="qiannan" data-type="nature">
              <img class="postcard-photo" src="./assets/xiaoqikong.webp" alt="绿水倒映小七孔古桥" width="960" height="800">
              <div class="postcard-caption">
                <h2>小七孔</h2><p>黔南州<span aria-hidden="true"> · </span>自然风光</p>
              </div>
            </li>
          </ul>
          <section class="paper no-results" id="no-results" hidden>
            <h2>这组条件下暂无景区</h2>
            <button id="reset-filters" type="button">查看全部景区</button>
          </section>
        </div>
      </div>

      <nav class="main-nav" aria-label="主场景">
        <a class="nav-tab" href="http://127.0.0.1:8782/design/review/index.html#partner" target="_blank" rel="noopener">
          <span class="nav-art nav-art-companion" aria-hidden="true"><img class="portrait" src="../../../design/review/journal-art/companion.webp" alt=""></span>
          <span>伙伴</span>
        </a>
        <a class="nav-tab" href="./index.html" aria-current="page">
          <span class="nav-art nav-art-map" aria-hidden="true"></span><span>游玩</span>
        </a>
        <a class="nav-tab" href="http://127.0.0.1:8782/design/review/index.html#memories" target="_blank" rel="noopener">
          <span class="nav-art nav-art-journal" aria-hidden="true"></span><span>回忆</span>
        </a>
      </nav>
    </section>
  </main>

  <dialog class="region-sheet" id="region-sheet" aria-labelledby="region-title">
    <form method="dialog">
      <header class="region-head">
        <h2 id="region-title">按地市州筛选</h2>
        <button class="close-sheet" type="submit" value="cancel" aria-label="关闭">×</button>
      </header>
      <div class="region-options">
        <button type="submit" value="all" aria-pressed="true">全部市州</button>
        <button type="submit" value="anshun" aria-pressed="false">安顺市</button>
        <button type="submit" value="guiyang" aria-pressed="false">贵阳市</button>
        <button type="submit" value="qiannan" aria-pressed="false">黔南州</button>
      </div>
    </form>
  </dialog>
</body>
</html>
