<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>衣橱与回忆 · 接入验收</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #eee7d9; color: #352a27; font: 15px/1.65 "PingFang SC", "Microsoft YaHei", sans-serif }
    main { max-width: 920px; margin: auto; padding: 24px 16px 40px }
    h1, h2 { margin: 0 0 8px; font-family: "Songti SC", SimSun, serif; line-height: 1.2 }
    h1 { font-size: clamp(24px, 6vw, 36px) }
    h2 { font-size: 23px }
    a { color: #653e34; text-underline-offset: 4px }
    header { padding-bottom: 14px; border-bottom: 1px solid #b8a490 }
    nav { display: flex; flex-wrap: wrap; gap: 6px 16px }
    section { margin-top: 24px }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 14px }
    figure { margin: 0; padding: 8px; border: 1px solid #c7b39f; background: #f7f1e5 }
    figcaption { margin-bottom: 5px }
    img { display: block; width: 100%; height: auto; background: #5f493d }
    @media (max-width: 510px) { .pair { grid-template-columns: minmax(0, 1fr) } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>衣橱与回忆 · 接入验收</h1>
    <p>用相同搭配和足迹对照确认稿。游客链路另用独立评审身份完成真实试穿、收藏和下载。</p>
    <nav aria-label="验收入口">
      <a href="../../../design/review/index.html">打开游客评审</a>
      <a href="experience.json">功能记录</a>
      <a href="visual.json">视觉记录</a>
      <a href="travel-single.png">打开单页 PNG</a>
      <a href="travel-keepsake.png">打开长图 PNG</a>
    </nav>
  </header>
  <section>
    <h2>衣橱还原 · 360×640</h2>
    <div class="pair">
      <figure><figcaption>确认样板 · 黔山初见上装</figcaption><img src="../../wardrobe-grid-review/2026-11-18/thumbnail-status/quick-selection.webp" width="360" height="640" alt="确认样板的工坊全身、快选、保存勾标和试穿描边"></figure>
      <figure><figcaption>游客入口 · 同一套搭配</figcaption><img src="wardrobe.webp" width="360" height="640" alt="游客入口中同一件红色上装、全身舞台、七类和底部动作"></figure>
    </div>
  </section>
  <section>
    <h2>旅行手账还原 · 390×844</h2>
    <div class="pair">
      <figure><figcaption>确认稿 · 三日六条</figcaption><img src="reference-memory.webp" width="390" height="844" alt="确认稿的纸页、书脊、地点插画、到店和手作印签" loading="lazy"></figure>
      <figure><figcaption>游客入口 · 相同的经历</figcaption><img src="memory.webp" width="390" height="844" alt="游客入口中的三日六条足迹、日期筛选与木托架" loading="lazy"></figure>
    </div>
  </section>
  <section>
    <h2>小屏和完整流程</h2>
    <div class="pair">
      <figure><figcaption>全部单品网格</figcaption><img src="wardrobe-grid.webp" width="360" height="640" alt="三列单品和右上放大镜，底部贴边的完整网格" loading="lazy"></figure>
      <figure><figcaption>滚到书尾</figcaption><img src="memory-tail.webp" width="360" height="640" alt="末条可达、纸页完整收边、固定制作与导航不遮挡内容" loading="lazy"></figure>
      <figure><figcaption>作品册的单页与长图</figcaption><img src="memory-works.webp" width="390" height="844" alt="单页和长图并列，长图有标签且缩略只裁顶部" loading="lazy"></figure>
      <figure><figcaption>从照相馆往返衣橱后生成预览</figcaption><img src="preview.webp" width="390" height="844" alt="衣橱保存回原制作后，照相馆生成含新搭配和两段经历的实际长图" loading="lazy"></figure>
    </div>
  </section>
</main>
</body>
</html>
